[project]
name = "spiral-sandbox"
version = "0.0.1"
description = "Comparative 3D reconstruction sandbox for the Spiral Framework paper."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Zach Sundown" }]
dependencies = [
    "pydantic>=2",
    "pyyaml",
    "numpy",
    "scipy",
    "open3d",
    "imageio",
    "pillow",
]

[project.optional-dependencies]
gpu = [
    "torch",
    "torchvision",
    "nerfstudio",
    "gsplat",
    "lpips",
]
analysis = [
    "matplotlib",
    "pandas",
    "seaborn",
]
dev = [
    "pytest",
    "ruff",
    "mypy",
]

[project.scripts]
spiral-sandbox = "spiral_sandbox.run:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/spiral_sandbox"]
